<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sona</title>
  <style>
    body { width: 280px; margin: 0; padding: 18px; font: 14px system-ui, sans-serif; color: #222; }
    h1 { margin: 0 0 16px; font-size: 18px; }
    label { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    input { width: 18px; height: 18px; margin: 0; }
    p { margin: 12px 0 0; color: #555; line-height: 1.4; }
    #status { min-height: 1.4em; }
  </style>
</head>
<body>
  <h1>Sona</h1>
  <label><input id="noiseSuppression" type="checkbox">Noise cancellation</label>
  <p>Applies to your microphone during calls and meetings. Other people's audio plays normally.</p>
  <p>Reload call or meeting tabs after updating the extension.</p>
  <p id="status" role="status"></p>
  <script src="popup.js"></script>
</body>
</html>
