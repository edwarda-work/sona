<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sona</title>
  <style>
    :root { color-scheme: light; --sona-pink: #d00062; --white: #fff; }
    * { box-sizing: border-box; }
    body { width: 300px; margin: 0; background: var(--white); color: var(--sona-pink); font: 14px/1.45 system-ui, sans-serif; }
    header { padding: 18px 20px; background: var(--sona-pink); color: var(--white); }
    h1 { margin: 0; font-size: 20px; line-height: 1.2; }
    main { padding: 18px 20px 20px; }
    label { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 700; cursor: pointer; }
    input { appearance: none; flex: none; width: 44px; height: 26px; margin: 0; border: 2px solid var(--sona-pink); border-radius: 99px; background: var(--white); cursor: pointer; position: relative; }
    input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--sona-pink); transition: transform .15s ease, background .15s ease; }
    input:checked { background: var(--sona-pink); }
    input:checked::after { background: var(--white); transform: translateX(18px); }
    input:focus-visible { outline: 3px solid var(--sona-pink); outline-offset: 3px; }
    p { margin: 14px 0 0; }
    .note { font-size: 12px; }
    #status { min-height: 1.45em; font-weight: 600; }
  </style>
</head>
<body>
  <header><h1>Sona</h1></header>
  <main>
    <label for="noiseSuppression">Noise cancellation <input id="noiseSuppression" type="checkbox"></label>
    <p>Clearer microphone audio during calls and meetings. Other people's audio plays normally.</p>
    <p class="note">Reload call or meeting tabs after updating Sona.</p>
    <p class="note">Microphone status</p>
    <p id="status" role="status">Checking…</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
